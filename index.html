<!doctype html>
<html>
<head>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700&family=Quicksand:wght@700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', 'Noto Sans KR', sans-serif; }

        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://www.dmoe.cc/random.php') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Lớp hiệu ứng hạt phủ toàn màn hình */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 2; /* Nằm trên hình nền, dưới nội dung */
        }

        .content {
            position: relative;
            z-index: 10;
            width: 850px;
            height: 480px;
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }

        .content:hover {
            box-shadow: 0 0 30px rgba(0, 211, 248, 0.8);
            border-color: rgba(0, 211, 248, 0.5);
        }

        .content img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 5px solid #fff;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.7);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .content_r { flex: 1; margin-left: 50px; text-align: center; color: #ffffff; }

        h2 {
            font-size: 32px; margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 211, 248, 0.4);
        }

        .bio {
            margin-top: 8px; font-size: 17px; font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }

        .color_1 {
            display: inline-block; margin: 15px 0; color: #00f2fe; 
            font-weight: bold; font-size: 18px; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 2px 2px 4px rgba(0,0,0,1);
        }

        .deeppink {
            color: #ff007f; font-weight: bold; font-size: 20px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 2px 2px 4px rgba(0,0,0,1);
        }

        .link { margin-top: 25px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }

        .link a {
            display: inline-flex; align-items: center; justify-content: center;
            width: 140px; height: 45px; color: #fff; font-weight: bold;
            border-radius: 12px; transition: 0.3s; text-decoration: none;
            border: 1px solid rgba(255,255,255,0.1); text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .link a i { margin-right: 8px; font-size: 18px; }

        .link a:hover { transform: translateY(-5px) scale(1.05); filter: brightness(1.2); }

        .dodgerblue { background: linear-gradient(45deg, #0072ff, #00c6ff); }
        .black { background: linear-gradient(45deg, #000000, #333333); }
        .green { background: linear-gradient(45deg, #2193b0, #6dd5ed); }
        .instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        @media (max-width: 800px) {
            .content { flex-direction: column; width: 95%; height: auto; padding: 40px 20px; }
            .content img { width: 180px; height: 180px; margin: 0 0 20px 0; }
            .content_r { margin-left: 0; }
        }
    </style>
</head>

<body onclick="audio.play()">
    <div id="particles-js"></div>

    <div class="content">
        <img src="https://i.imgur.com/husZp7M.gif" alt="Avatar">
        <div class="content_r">
            <h2>안녕하세요 <3</h2>
            <p class="bio">당신의 방문을 환영합니다!</p>
            <p class="bio">당신을 위해 나의 힘을 사용하겠습니다!</p>
            
            <p class="color_1">ＯＰＥＲＡＴＯＲ：Phan Van Duong</p>
            <br>
            <p class="deeppink">/ phanvanduong /</p>

            <div class="link">
                <a href="https://www.facebook.com/share/1ET6MWXYK9/?mibextid=wwXIfr" class="dodgerblue" target="_blank"><i class="fa fa-facebook-square"></i> Facebook</a>
                <a href="https://www.tiktok.com/@_vanduong_p" class="black" target="_blank"><i class="fa fa-tiktok-play"></i> TikTok</a>
                <a href="https://t.me/vankhanhm" class="green" target="_blank"><i class="fa fa-telegram"></i> Telegram</a>
                <a href="https://www.instagram.com/your_username" class="instagram" target="_blank"><i class="fa fa-instagram"></i> Instagram</a>
            </div>
        </div>
    </div>

    <script>
        var audio = new Audio('https://files.catbox.moe/fzj8z3.mp3');
        audio.loop = true;

        // Cấu hình HIỆU ỨNG HẠT (Particles) rõ nét hơn
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.7, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 1, "opacity_min": 0.1, "sync": false } 
                },
                "size": { 
                    "value": 4, 
                    "random": true, 
                    "anim": { "enable": true, "speed": 4, "size_min": 0.3, "sync": false } 
                },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#ffffff", 
                    "opacity": 0.4, 
                    "width": 1 
                },
                "move": { 
                    "enable": true, 
                    "speed": 3, 
                    "direction": "none", 
                    "random": true, 
                    "straight": false, 
                    "out_mode": "out", 
                    "bounce": false 
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "grab" }, /* Hút hạt khi di chuột */
                    "onclick": { "enable": true, "mode": "push" }, /* Thêm hạt khi click */
                    "resize": true
                },
                "modes": {
                    "grab": { "distance": 200, "line_linked": { "opacity": 0.8 } },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });

        // Hiệu ứng Sakura
        var img = new Image();
        img.src = "https://i.imgur.com/R9XUjfF.png";
        function Sakura(x, y, s, r, fn) {
            this.x = x; this.y = y; this.s = s; this.r = r; this.fn = fn;
        }
        Sakura.prototype.draw = function(cxt) {
            cxt.save(); cxt.translate(this.x, this.y); cxt.rotate(this.r);
            cxt.drawImage(img, 0, 0, 40 * this.s, 40 * this.s); cxt.restore();
        }
        Sakura.prototype.update = function() {
            this.x = this.fn.x(this.x, this.y); this.y = this.fn.y(this.y, this.y); this.r = this.fn.r(this.r);
            if(this.x > window.innerWidth || this.x < 0 || this.y > window.innerHeight) {
                this.y = -20; this.x = Math.random() * window.innerWidth;
            }
        }
        function startSakura() {
            var canvas = document.createElement('canvas'), cxt;
            canvas.height = window.innerHeight; canvas.width = window.innerWidth;
            canvas.setAttribute('style', 'position: fixed;left: 0;top: 0;pointer-events: none;z-index:15;');
            document.body.appendChild(canvas);
            cxt = canvas.getContext('2d');
            var sakuraList = [];
            for(var i = 0; i < 20; i++) {
                sakuraList.push(new Sakura(Math.random()*window.innerWidth, Math.random()*window.innerHeight, Math.random(), Math.random()*5, {
                    x: function(x){ return x + 0.5; }, y: function(y){ return y + 1.2; }, r: function(r){ return r + 0.02; }
                }));
            }
            function step() {
                cxt.clearRect(0, 0, canvas.width, canvas.height);
                sakuraList.forEach(s => { s.update(); s.draw(cxt); });
                requestAnimationFrame(step);
            }
            step();
        }
        img.onload = startSakura;

        window.onload = function() {
            Swal.fire({
                title: 'Phan Van Duong <3',
                text: '환영합니다!',
                icon: 'success',
                background: '#1a1a1a',
                color: '#fff',
                confirmButtonColor: '#ff007f'
            });
        }
    </script>
</body>
</html>
